<svg width="1600" height="980" viewBox="0 0 1600 980" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">CNN Model Flow for Cotton Disease Detection</title>
  <desc id="desc">Diagram showing a convolutional neural network for cotton leaf disease classification from input image to output disease class.</desc>

  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7fff8"/>
      <stop offset="100%" stop-color="#eef8ff"/>
    </linearGradient>
    <linearGradient id="inputGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dff7e7"/>
      <stop offset="100%" stop-color="#c6f3d1"/>
    </linearGradient>
    <linearGradient id="convGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/>
      <stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="poolGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="denseGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fce7f3"/>
      <stop offset="100%" stop-color="#fbcfe8"/>
    </linearGradient>
    <linearGradient id="outputGrad" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#dcfce7"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="11" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#3b82f6"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      .title { font: 700 32px 'Segoe UI', sans-serif; fill: #0f172a; }
      .subtitle { font: 600 18px 'Segoe UI', sans-serif; fill: #334155; }
      .boxTitle { font: 700 24px 'Segoe UI', sans-serif; fill: #0f172a; }
      .smallTitle { font: 700 18px 'Segoe UI', sans-serif; fill: #0f172a; }
      .label { font: 600 17px 'Segoe UI', sans-serif; fill: #0f172a; }
      .tiny { font: 500 14px 'Segoe UI', sans-serif; fill: #475569; }
      .arrowText { font: 700 15px 'Segoe UI', sans-serif; fill: #2563eb; }
      .node { stroke: rgba(15, 23, 42, 0.12); stroke-width: 1.5; }
      .step { fill: #ffffff; }
      .arrow { stroke: #3b82f6; stroke-width: 4; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1600" height="980" fill="url(#bg)"/>
  <text x="800" y="70" text-anchor="middle" class="title">CNN Model for Cotton Leaf Disease Detection</text>
  <text x="800" y="102" text-anchor="middle" class="subtitle">Image → Feature Extraction → Classification</text>

  <!-- Input layer -->
  <rect x="70" y="180" width="180" height="190" rx="24" fill="url(#inputGrad)" class="node" filter="url(#shadow)"/>
  <text x="160" y="225" text-anchor="middle" class="boxTitle">Input Image</text>
  <rect x="95" y="250" width="130" height="90" rx="18" fill="#ffffff" opacity="0.85"/>
  <rect x="105" y="260" width="110" height="70" rx="12" fill="#d9f99d" opacity="0.9"/>
  <circle cx="127" cy="280" r="12" fill="#3a7d3e" opacity="0.8"/>
  <circle cx="170" cy="290" r="16" fill="#4ade80" opacity="0.9"/>
  <circle cx="148" cy="315" r="18" fill="#86efac" opacity="0.8"/>
  <text x="160" y="340" text-anchor="middle" class="smallTitle">128×128×3</text>
  <text x="160" y="360" text-anchor="middle" class="tiny">RGB cotton leaf image</text>

  <!-- Conv 1 -->
  <rect x="320" y="170" width="180" height="210" rx="24" fill="url(#convGrad)" class="node" filter="url(#shadow)"/>
  <text x="410" y="208" text-anchor="middle" class="boxTitle">Conv Layer 1</text>
  <text x="410" y="238" text-anchor="middle" class="label">3×3 kernel</text>
  <text x="410" y="268" text-anchor="middle" class="label">32 filters</text>
  <text x="410" y="298" text-anchor="middle" class="label">ReLU</text>
  <text x="410" y="330" text-anchor="middle" class="tiny">Detect edges, textures, veins</text>
  <text x="410" y="352" text-anchor="middle" class="tiny">Feature map output</text>

  <!-- Pool 1 -->
  <rect x="570" y="170" width="170" height="210" rx="24" fill="url(#poolGrad)" class="node" filter="url(#shadow)"/>
  <text x="655" y="208" text-anchor="middle" class="boxTitle">Max Pool</text>
  <text x="655" y="238" text-anchor="middle" class="label">2×2</text>
  <text x="655" y="268" text-anchor="middle" class="label">Downsample</text>
  <text x="655" y="298" text-anchor="middle" class="label">Reduce size</text>
  <text x="655" y="330" text-anchor="middle" class="tiny">Keep important patterns</text>

  <!-- Conv 2 -->
  <rect x="820" y="170" width="180" height="210" rx="24" fill="url(#convGrad)" class="node" filter="url(#shadow)"/>
  <text x="910" y="208" text-anchor="middle" class="boxTitle">Conv Layer 2</text>
  <text x="910" y="238" text-anchor="middle" class="label">3×3 kernel</text>
  <text x="910" y="268" text-anchor="middle" class="label">64 filters</text>
  <text x="910" y="298" text-anchor="middle" class="label">ReLU</text>
  <text x="910" y="330" text-anchor="middle" class="tiny">Learn disease-specific patterns</text>

  <!-- Pool 2 -->
  <rect x="1070" y="170" width="170" height="210" rx="24" fill="url(#poolGrad)" class="node" filter="url(#shadow)"/>
  <text x="1155" y="208" text-anchor="middle" class="boxTitle">Max Pool</text>
  <text x="1155" y="238" text-anchor="middle" class="label">2×2</text>
  <text x="1155" y="268" text-anchor="middle" class="label">Compression</text>
  <text x="1155" y="298" text-anchor="middle" class="label">Feature summary</text>
  <text x="1155" y="330" text-anchor="middle" class="tiny">Better generalization</text>

  <!-- Flatten + Dense -->
  <rect x="285" y="480" width="1030" height="260" rx="30" fill="#ffffff" opacity="0.95" class="node" filter="url(#shadow)"/>
  <text x="800" y="530" text-anchor="middle" class="boxTitle">Classification Head</text>

  <rect x="370" y="570" width="220" height="120" rx="22" fill="url(#denseGrad)" class="node"/>
  <text x="480" y="612" text-anchor="middle" class="smallTitle">Flatten</text>
  <text x="480" y="642" text-anchor="middle" class="label">2D features → 1D vector</text>

  <rect x="650" y="570" width="240" height="120" rx="22" fill="url(#denseGrad)" class="node"/>
  <text x="770" y="612" text-anchor="middle" class="smallTitle">Dense Layer</text>
  <text x="770" y="642" text-anchor="middle" class="label">256 neurons</text>
  <text x="770" y="668" text-anchor="middle" class="tiny">Learned classification rules</text>

  <rect x="935" y="570" width="250" height="120" rx="22" fill="url(#denseGrad)" class="node"/>
  <text x="1060" y="612" text-anchor="middle" class="smallTitle">Output Layer</text>
  <text x="1060" y="642" text-anchor="middle" class="label">Disease classes</text>
  <text x="1060" y="668" text-anchor="middle" class="tiny">Softmax / probabilities</text>

  <!-- Output -->
  <rect x="650" y="800" width="300" height="110" rx="24" fill="url(#outputGrad)" class="node" filter="url(#shadow)"/>
  <text x="800" y="840" text-anchor="middle" class="boxTitle">Prediction Result</text>
  <text x="800" y="870" text-anchor="middle" class="label">Healthy / Diseased / Disease Name</text>
  <text x="800" y="894" text-anchor="middle" class="tiny">Confidence score + class label</text>

  <!-- Arrows -->
  <path d="M 250 275 L 320 275" class="arrow"/>
  <text x="270" y="255" text-anchor="middle" class="arrowText">Input</text>

  <path d="M 500 275 L 570 275" class="arrow"/>
  <text x="535" y="255" text-anchor="middle" class="arrowText">Extract</text>

  <path d="M 740 275 L 820 275" class="arrow"/>
  <text x="782" y="255" text-anchor="middle" class="arrowText">More features</text>

  <path d="M 1000 275 L 1070 275" class="arrow"/>
  <text x="1040" y="255" text-anchor="middle" class="arrowText">Compress</text>

  <path d="M 1155 380 L 1155 470" class="arrow"/>
  <text x="1178" y="430" text-anchor="middle" class="arrowText">Features</text>

  <path d="M 800 740 L 800 800" class="arrow"/>
  <text x="826" y="770" text-anchor="middle" class="arrowText">Classify</text>

  <!-- Bottom note -->
  <text x="800" y="940" text-anchor="middle" class="tiny">This model learns leaf patterns from labeled disease images and predicts the most likely class for a new leaf image.</text>
</svg>
